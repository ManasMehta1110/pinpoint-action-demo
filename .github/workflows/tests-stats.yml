name: Tests (stats)

on:
  pull_request:
    paths:
      - "stats.py"
      - "tests/test_stats.py"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pytest
      - run: python -m pytest -q tests/test_stats.py
