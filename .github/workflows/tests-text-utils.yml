name: Tests (text_utils)

on:
  pull_request:
    paths:
      - "text_utils.py"
      - "tests/test_text_utils.py"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pytest
      - run: python -m pytest -q tests/test_text_utils.py
